esphome:
  name: office-loud-esp32-s3
  friendly_name: Office Loud-ESP32-S3
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep the default Mozilla bundle and append our own CA chain to it
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: y
      CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE: y
      # Relative to the build dir (.esphome/build/<name>/)
      CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE_PATH: '"../../../chain-g3.pem"'

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret office_loud_esp32_s3__encryption_key
  homeassistant_services: true
  homeassistant_states: true

# Allow Over-The-Air updates
ota:
- platform: esphome
  encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false
  fast_connect: true

time:
  - platform: homeassistant
    id: time_homeassistant_1
    timezone: Europe/Paris

i2s_audio:
  - id: max98357
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO14
  # Mic header (I2S1)
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO40
    i2s_bclk_pin: GPIO41

microphone:
  - platform: i2s_audio
    id: office_mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    i2s_din_pin: GPIO39
    pdm: false
    # INMP441 soldered in the L header slot (LR tied to GND)
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    use_apll: true

speaker:
  # 1. Physical Hardware Output
  - platform: i2s_audio
    id: speaker_hardware
    dac_type: external
    i2s_audio_id: max98357
    i2s_dout_pin: GPIO16
    channel: stereo

  # 2. Mixer generating virtual source inputs
  - platform: mixer
    id: speaker_mixer
    output_speaker: speaker_hardware
    queue_mode: true
    source_speakers:
      - id: spk_announcement
      - id: spk_media

# Amp unmute pin: GPIO17 on board rev G and later, GPIO8 on rev F
switch:
  - platform: gpio
    id: enable_dac
    name: "Enable DAC"
    icon: "mdi:speaker"
    pin: GPIO17
    restore_mode: ALWAYS_OFF

  - platform: template
    id: use_wake_word
    name: "Voice assistant"
    icon: "mdi:assistant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition: api.connected
          then:
            - voice_assistant.stop:
            - micro_wake_word.start:
    on_turn_off:
      - voice_assistant.stop:
      - micro_wake_word.stop:

  - platform: template
    id: wake_sound
    name: "Wake sound"
    icon: "mdi:bullhorn"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # On while a voice timer is ringing; turn off (or say the wake word) to silence it
  - platform: template
    id: timer_ringing
    name: "Timer ringing"
    icon: "mdi:timer-alert"
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: spk_media
          decibel_reduction: 20
          duration: 0s
      - script.execute: ring_timer
      - script.execute: timer_ring_timeout
    on_turn_off:
      - script.stop: ring_timer
      - script.stop: timer_ring_timeout
      - if:
          condition:
            media_player.is_announcing: office_speaker
          then:
            - media_player.stop:
                id: office_speaker
                announcement: true
      - mixer_speaker.apply_ducking:
          id: spk_media
          decibel_reduction: 0
          duration: 1s
      - if:
          condition:
            media_player.is_idle: office_speaker
          then:
            - switch.turn_off: enable_dac

button:
  - platform: template
    id: stop_media_player
    name: "Stop media player"
    icon: "mdi:stop"
    on_press:
      - media_player.stop: office_speaker
      - switch.turn_off: enable_dac

script:
  - id: ring_timer
    mode: restart
    then:
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_finished_sound
                announcement: true
            - wait_until:
                condition:
                  media_player.is_announcing: office_speaker
                timeout: 1s
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing: office_speaker
            - delay: 500ms

  - id: timer_ring_timeout
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: timer_ringing

media_player:
  - platform: speaker
    name: "Office Media Player"
    id: office_speaker
    icon: "mdi:music-box-multiple-outline"
    on_play:
      - switch.turn_on: enable_dac
    on_announcement:
      - switch.turn_on: enable_dac
    on_idle:
      # Keep the amp on between the wake chime and the TTS reply, and between timer rings
      - if:
          condition:
            and:
              - not: voice_assistant.is_running
              - switch.is_off: timer_ringing
          then:
            - switch.turn_off: enable_dac
    files:
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    announcement_pipeline:
      speaker: spk_announcement
      format: FLAC
      num_channels: 2
    media_pipeline:
      speaker: spk_media
      format: NONE
      num_channels: 2

esp32_ble_tracker:

bluetooth_proxy:
  active: true

http_request:
  verify_ssl: true

micro_wake_word:
  id: mww
  microphone: office_mic
  # Each wake word can be bound to its own Assist pipeline in HA
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
  on_wake_word_detected:
    # Wake word silences a ringing timer instead of starting a command
    - if:
        condition:
          switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
          - micro_wake_word.start:
        else:
          - if:
              condition: voice_assistant.is_running
              then:
                - voice_assistant.stop:
              else:
                - if:
                    condition:
                      switch.is_on: wake_sound
                    then:
                      - media_player.speaker.play_on_device_media_file:
                          media_file: wake_word_triggered_sound
                          announcement: true
                      - delay: 300ms
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    - microphone: office_mic
  media_player: office_speaker
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_client_connected:
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  on_start:
    # Duck music while listening and replying
    - mixer_speaker.apply_ducking:
        id: spk_media
        decibel_reduction: 20
        duration: 0s
  on_end:
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
      - mixer_speaker.apply_ducking:
          id: spk_media
          decibel_reduction: 0
          duration: 1s
      - if:
          condition:
            media_player.is_idle: office_speaker
          then:
            - switch.turn_off: enable_dac
      - if:
          condition:
            switch.is_on: use_wake_word
          then:
            - micro_wake_word.start:
  on_error:
    - delay: 1s
    - if:
        condition:
          switch.is_on: use_wake_word
        then:
          - micro_wake_word.start:
  on_timer_finished:
    - switch.turn_on: timer_ringing
