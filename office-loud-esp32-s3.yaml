substitutions:
  # Mac running tools/record_mic.py
  mic_stream_host: 192.168.8.205
  mic_stream_port: "5005"

esphome:
  name: office-loud-esp32-s3
  friendly_name: Office Loud-ESP32-S3
  min_version: 2026.4.0
  name_add_mac_suffix: false
  includes:
    - mic_udp.h

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Keep the default Mozilla bundle and append our own CA chain to it
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: y
      CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE: y
      # Relative to the build dir (.esphome/build/<name>/)
      CONFIG_MBEDTLS_CUSTOM_CERTIFICATE_BUNDLE_PATH: '"../../../chain-g3.pem"'

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret office_loud_esp32_s3__encryption_key
  homeassistant_services: true
  homeassistant_states: true

# Allow Over-The-Air updates
ota:
- platform: esphome
  encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  post_connect_roaming: false
  fast_connect: true

time:
  - platform: homeassistant
    id: time_homeassistant_1
    timezone: Europe/Paris

i2s_audio:
  - id: max98357
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO14
  # Mic header (I2S1)
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO40
    i2s_bclk_pin: GPIO41

microphone:
  - platform: i2s_audio
    id: office_mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    i2s_din_pin: GPIO39
    pdm: false
    # INMP441 soldered in the L header slot (LR tied to GND)
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    on_data:
      - lambda: mic_udp::send(x);

speaker:
  # 1. Physical Hardware Output
  - platform: i2s_audio
    id: speaker_hardware
    dac_type: external
    i2s_audio_id: max98357
    i2s_dout_pin: GPIO16
    channel: stereo

  # 2. Mixer generating virtual source inputs
  - platform: mixer
    id: speaker_mixer
    output_speaker: speaker_hardware
    queue_mode: true
    source_speakers:
      - id: spk_announcement
      - id: spk_media

# Amp unmute pin: GPIO17 on board rev G and later, GPIO8 on rev F
switch:
  - platform: gpio
    id: enable_dac
    name: "Enable DAC"
    icon: "mdi:speaker"
    pin: GPIO17
    restore_mode: ALWAYS_OFF

  - platform: template
    id: mic_stream
    name: "Mic stream"
    icon: "mdi:microphone"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: mic_udp::begin("${mic_stream_host}", ${mic_stream_port});
      - microphone.capture: office_mic
    turn_off_action:
      - microphone.stop_capture: office_mic

media_player:
  - platform: speaker
    name: "Office Media Player"
    id: office_speaker
    icon: "mdi:music-box-multiple-outline"
    on_play:
      - switch.turn_on: enable_dac
    on_announcement:
      - switch.turn_on: enable_dac
    on_idle:
      - switch.turn_off: enable_dac
    announcement_pipeline:
      speaker: spk_announcement
      format: FLAC
      num_channels: 2
    media_pipeline:
      speaker: spk_media
      format: NONE
      num_channels: 2

esp32_ble_tracker:

bluetooth_proxy:
  active: true

http_request:
  verify_ssl: true
