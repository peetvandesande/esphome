esphome:
  name: kitchen-loud-esp32-s3
  friendly_name: Kitchen Loud-ESP32-S3
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret kitchen_loud_esp32_s3__encryption_key
  homeassistant_services: true
  homeassistant_states: true

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: UB!JWEq$G@IsXvJuK$

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: time_homeassistant_1
    timezone: Europe/Paris

i2s_audio:
  - id: max98357
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO14

speaker:
  - platform: i2s_audio
    id: speaker_max98357
    dac_type: external
    i2s_audio_id: max98357
    i2s_dout_pin: GPIO16
    channel: stereo
